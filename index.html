    <!--
      Apply the stored theme before first paint. This runs on every route
      (including 404) and prevents a flash of the wrong theme; ThemeToggle only
      flips it afterwards.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          if (!stored) {
            stored = "dark";
            localStorage.setItem("theme", stored);
          }
          document.documentElement.classList.toggle("dark", stored === "dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
